services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance_agent
      POSTGRES_PASSWORD: finance_agent_local
      POSTGRES_DB: finance_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
